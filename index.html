<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><circle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23ff5d7a%27/><text x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27>沪</text></svg>">
    <title>上海 · 三维城市数字沙盘</title>
    <!-- 纯静态部署(GitHub Pages)时, 把下面这行的注释去掉并填入 deploy/worker.js
         部署后的地址, 线上即可走国内多源照片服务(高德 Key 存在 Worker 环境变量里,
         不要写在前端)。本地开发留着注释即可, 会自动走同源 /api/photo。
    <script>window.__PHOTO_API = 'https://<你的-worker地址>/api/photo';</script>
    -->
<style>
  :root{
    --bg:#070b14; --bg2:#0d1524;
    --glass:rgba(14,22,38,.86); --glass2:rgba(20,32,54,.72);
    --line:rgba(120,170,255,.16); --line2:rgba(120,170,255,.30);
    --txt:#dbe6f7; --dim:#8ba0c0; --dim2:#5f7a9c;
    --cy:#4fd6ff; --pk:#ff4d94; --gd:#ffd166; --gr:#5ef2a0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:var(--txt)}
  canvas#c{display:block;position:fixed;inset:0;outline:none}

  /* ---------- 载入 ---------- */
  #loading{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 45%,#12203a 0%,#070b14 70%);transition:opacity .7s}
  #loading.hide{opacity:0;pointer-events:none}
  .ld-title{font-size:26px;letter-spacing:10px;font-weight:300;color:#cfe4ff}
  .ld-sub{font-size:12px;color:#6f88ab;letter-spacing:3px}
  .ld-bar{width:280px;height:3px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
  .ld-bar i{display:block;height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#4fd6ff,#7c8cff,#ff4d94);transition:width .3s}
  .ld-txt{font-size:11px;color:#61789a;height:14px}

  /* ---------- 顶栏 ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:20;height:54px;display:flex;
    align-items:center;gap:16px;padding:0 18px;
    background:linear-gradient(180deg,rgba(7,11,20,.92),rgba(7,11,20,0));pointer-events:none}
  .brand{font-size:17px;font-weight:600;letter-spacing:2px;
    background:linear-gradient(90deg,#8ee6ff,#c4b5ff,#ff9ec7);-webkit-background-clip:text;
    background-clip:text;color:transparent;pointer-events:auto;white-space:nowrap}
  .brand small{display:block;font-size:9px;letter-spacing:2.5px;
    color:#5d7797;-webkit-text-fill-color:#5d7797;font-weight:400}

  /* ================= 左侧折叠控制台 ================= */
  #side{position:fixed;left:14px;top:64px;bottom:52px;z-index:22;width:330px;
    display:flex;flex-direction:column;
    background:var(--glass);border:1px solid var(--line);border-radius:13px;
    backdrop-filter:blur(4px);box-shadow:0 8px 34px rgba(0,0,0,.55);
    transition:width .28s cubic-bezier(.4,0,.2,1)}
  .side-hd{flex:none;display:flex;align-items:center;gap:6px;padding:10px 10px 9px 12px;
    border-bottom:1px solid var(--line)}
  /* v=33: 控制台字体整体放大, 之前太小看着吃力 */
  .side-hd span{flex:1;font-size:14px;font-weight:600;letter-spacing:3px;color:#a9c2e4;white-space:nowrap;overflow:hidden}
  .side-hd button{width:20px;height:20px;flex:none;border:1px solid var(--line);cursor:pointer;
    background:rgba(255,255,255,.05);color:#9ab;border-radius:6px;font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.16s}
  .side-hd button:hover{background:rgba(79,214,255,.18);color:#fff;border-color:var(--line2)}
  .side-bd{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px}
  .side-bd::-webkit-scrollbar{width:5px}
  .side-bd::-webkit-scrollbar-thumb{background:rgba(120,170,255,.24);border-radius:3px}

  /* 折叠段 */
  .acc{border-radius:9px;margin-bottom:4px;background:rgba(255,255,255,.018)}
  .acc>h4{display:flex;align-items:center;gap:7px;padding:8px 9px;cursor:pointer;
    font-size:14px;font-weight:500;color:#c2d4ec;letter-spacing:1px;user-select:none;
    border-radius:9px;transition:background .15s}
  .acc>h4:hover{background:rgba(120,170,255,.09)}
  .acc>h4 .chev{width:0;height:0;flex:none;border-left:5px solid #7d95b8;
    border-top:4px solid transparent;border-bottom:4px solid transparent;
    transition:transform .26s cubic-bezier(.4,0,.2,1)}
  .acc.open>h4 .chev{transform:rotate(90deg)}
  .acc>h4 em{margin-left:auto;font-style:normal;font-size:9px;color:#5f7a9c;letter-spacing:0}
  /* v=52: 手风琴改 grid 0fr/1fr 动画 —— 原 max-height 从 0 动到 calc(100vh-150px),
     关闭时前半程"空转"(值远大于内容高, 视觉上先顿后收), 且重排不受内容高约束 */
  .acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
  .acc.open>.acc-b{grid-template-rows:1fr}
  .acc-b>.acc-i{min-height:0;overflow:hidden;transition:padding .3s cubic-bezier(.4,0,.2,1)}
  .acc:not(.open)>.acc-b>.acc-i{padding-top:0;padding-bottom:0}
  .acc.open>.acc-b>.acc-i{overflow-y:auto}
  .acc-i{padding:2px 4px 8px}
  .acc-i::-webkit-scrollbar{width:5px}
  .acc-i::-webkit-scrollbar-thumb{background:rgba(120,170,255,.24);border-radius:3px}

  .lyr{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:7px;
    cursor:pointer;font-size:14px;transition:background .15s;user-select:none}
  .lyr:hover{background:rgba(120,170,255,.09)}
  .lyr i{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 8px currentColor}
  .lyr span{flex:1;color:#c2d4ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lyr em{font-style:normal;font-size:11px;color:#5f7a9c;flex:none}
  .sw{width:26px;height:14px;border-radius:8px;background:rgba(255,255,255,.13);
    position:relative;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;
    border-radius:50%;background:#7b8aa0;transition:.22s}
  .lyr.on .sw{background:rgba(79,214,255,.42)}
  .lyr.on .sw::after{left:14px;background:#4fd6ff}

  /* 游轮航速 */
  .spd{margin-top:7px;padding:7px 6px 6px;border-top:1px dashed rgba(120,170,255,.13)}
  .spd label{display:block;font-size:12.5px;color:#7d95b8;letter-spacing:1.4px;margin-bottom:5px}
  .spd-b{display:flex;gap:4px}
  .spd-b button{flex:1;padding:5px 0;font-size:12.5px;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:#8ba0c0;
    border-radius:6px;transition:.16s}
  .spd-b button:hover{border-color:var(--line2);color:#cfe4ff}
  .spd-b button.on{background:rgba(79,214,255,.20);border-color:var(--cy);color:#9fe6ff}
  .spd small{display:block;margin-top:5px;font-size:11px;color:#55708f;line-height:1.5}

  .vbtn{padding:7px 10px;margin-bottom:4px;background:var(--glass2);border:1px solid var(--line);
    border-radius:8px;font-size:13.5px;color:#b9cde8;cursor:pointer;transition:.16s;
    text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .vbtn:hover{border-color:var(--line2);color:#fff;background:rgba(30,48,80,.85);transform:translateX(2px)}
  .vbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vbtn b{font-weight:400;font-size:11px;color:#5c7a9c;flex:none}
  .vbtn.hub{background:linear-gradient(100deg,rgba(255,209,102,.10),rgba(20,32,54,.72));
    border-color:rgba(255,209,102,.30);color:#ffe2ab}
  .vbtn.hub:hover{border-color:#ffd166;color:#fff;background:rgba(60,48,20,.85)}
  .vbtn.hub::before{content:"⇄";margin-right:2px;color:#ffd166;font-size:11px}

  /* 收起态: 只留箭头, 贴紧左边缘无间隙, 去除黑框 */
  #side.fold{left:0;width:34px;top:64px;bottom:52px;border:none;border-radius:0 13px 13px 0;
    box-shadow:none;background:transparent;backdrop-filter:none}
  #side.fold .side-hd{justify-content:center;padding:10px 0 9px;border-bottom:none;background:transparent}
  #side.fold .side-hd span{display:none}
  #side.fold .side-bd{display:none}
  #side.fold .side-hd button{margin:0;border:none;width:26px;height:30px;background:rgba(255,255,255,.07);
    color:#cfe4ff;box-shadow:inset 0 0 0 1px rgba(120,170,255,.22)}

  /* ================= 详情抽屉 ================= */
  #panel{position:fixed;right:0;top:0;bottom:0;z-index:30;width:398px;
    background:var(--glass);border-left:1px solid var(--line);backdrop-filter:blur(6px);
    transform:translateX(100%);transition:transform .38s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-12px 0 44px rgba(0,0,0,.55)}
  #panel.open{transform:none}
  .p-head{padding:16px 18px 13px;border-bottom:1px solid var(--line);position:relative;flex:none}
  .p-kind{font-size:9.5px;letter-spacing:2.5px;color:#6c86a8;margin-bottom:5px}
  .p-title{font-size:20px;font-weight:600;color:#fff;letter-spacing:.5px;padding-right:28px;line-height:1.3}
  .p-sub{font-size:11px;color:#7b93b4;margin-top:5px}
  .p-close{position:absolute;right:14px;top:14px;width:24px;height:24px;border:none;cursor:pointer;
    background:rgba(255,255,255,.07);color:#9ab;border-radius:6px;font-size:15px;line-height:1}
  .p-close:hover{background:rgba(255,80,120,.22);color:#fff}
  .p-body{flex:1;overflow-y:auto;padding:14px 18px 24px}
  .p-body::-webkit-scrollbar{width:5px}
  .p-body::-webkit-scrollbar-thumb{background:rgba(120,170,255,.22);border-radius:3px}

  .blk{margin-bottom:16px}
  .blk-t{font-size:10px;letter-spacing:2.5px;color:#6c86a8;margin-bottom:9px;
    display:flex;align-items:center;gap:7px}
  .blk-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px;
    border-bottom:1px dashed rgba(120,170,255,.08)}
  .kv b{color:#a9c2e0;font-weight:400;flex:none}
  .kv span{color:#e4eefc;text-align:right;word-break:break-all}

  /* ---------- 实景影像 (在线卫星瓦片实时拼接) ---------- */
  .ph-box{position:relative;width:100%;height:206px;border-radius:10px;overflow:hidden;
    background:#0c1524;border:1px solid var(--line);cursor:zoom-in;transition:border-color .18s}
  .ph-box:hover{border-color:var(--line2)}
  .ph-canvas{position:absolute;inset:0;overflow:hidden}
  .ph-canvas img{display:block;user-select:none;-webkit-user-drag:none}
  .ph-box .ph-tag{position:absolute;left:9px;bottom:8px;z-index:11;padding:3px 9px;border-radius:20px;
    background:rgba(6,12,22,.78);font-size:10px;color:#cfe4ff;letter-spacing:.5px;
    backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.10);pointer-events:none}
  .ph-box .ph-zoom{position:absolute;right:9px;bottom:8px;z-index:11;padding:3px 8px;border-radius:6px;
    background:rgba(6,12,22,.78);font-size:10px;color:#8fd0ff;
    border:1px solid rgba(255,255,255,.10);pointer-events:none;backdrop-filter:blur(6px)}
  .ph-box .ph-load{position:absolute;inset:0;z-index:12;display:flex;align-items:center;
    justify-content:center;font-size:10.5px;color:#8fb0d8;letter-spacing:1px;pointer-events:none;
    background:rgba(8,14,26,.72)}
  .ph-strip{display:flex;gap:5px;margin-top:7px}
  .ph-strip>div{flex:1;height:42px;border-radius:7px;overflow:hidden;cursor:pointer;
    border:1px solid var(--line);opacity:.55;transition:.18s;position:relative;background:#0c1524}
  .ph-strip>div.cur{opacity:1;border-color:var(--cy);box-shadow:0 0 0 1px rgba(79,214,255,.45)}
  .ph-strip>div:hover{opacity:1}
  .ph-strip img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-strip u{position:absolute;left:0;right:0;bottom:0;text-decoration:none;text-align:center;
    font-size:8px;color:#dbe6f7;background:rgba(6,12,22,.72);padding:1px 0;letter-spacing:.2px}
  .ph-src{margin-top:6px;font-size:9.5px;color:#55708f;letter-spacing:.3px}
  .desc{font-size:11.5px;color:#9fb6d4;line-height:1.75;margin-top:2px}

  /* 真实照片 (Wikimedia) */
  .rp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .rp-cell{position:relative;aspect-ratio:1/0.72;overflow:hidden;border-radius:7px;
    border:1px solid var(--line);cursor:zoom-in;background:#0c1524}
  .rp-cell img{width:100%;height:100%;object-fit:cover;display:block}
  .rp-cell u{position:absolute;left:0;right:0;bottom:0;text-decoration:none;font-size:8px;
    color:#dbe6f7;background:rgba(6,12,22,.72);padding:1px 3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-load{font-size:10px;color:#7b93b4;padding:4px 0}
  .rp-note{font-size:9.5px;color:#55708f;margin-top:4px}

  /* 附近美食 */
  .foods{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
  .food{display:flex;flex-direction:column;gap:2px;padding:7px 9px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px}
  .food b{font-size:12px;color:#ffd9a0;font-weight:600}
  .food span{font-size:10.5px;color:#9fb6d4;line-height:1.5}

  /* ---------- 地标导览 搜索 / 分组 ---------- */
  .mk-search{padding:2px 2px 6px}
  .mk-search input{width:100%;padding:6px 10px;border-radius:7px;font-size:13.5px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);
    outline:none;transition:.16s;font-family:inherit}
  .mk-search input:focus{border-color:var(--line2);background:rgba(79,214,255,.08)}
  .mk-search input::placeholder{color:#55708f}
  .mk-cat{font-size:11.5px;letter-spacing:1.6px;color:#7d95b8;margin:8px 0 5px 2px;
    display:flex;align-items:center;gap:6px}
  .mk-cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  /* v=33: 区名折叠头 —— 可点击, 带小箭头和数量 */
  /* v=37: 箭头改为 CSS 三角 (无字形基线差), 区名 span 设 line-height:1 精确垂直居中 */
  .mk-cat-toggle{padding:4px 5px;border-radius:6px;transition:background .15s;
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .mk-cat-toggle:hover{background:rgba(120,170,255,.10);color:#c2d4ec}
  .mk-cat-toggle .chev2{font-style:normal;font-size:9px;color:#5f7a9c;width:10px;flex:none}
  .mk-cat-toggle .chev3{width:0;height:0;flex:none;border-left:5px solid #7d95b8;
    border-top:4px solid transparent;border-bottom:4px solid transparent;
    transition:transform .22s cubic-bezier(.4,0,.2,1)}
  .mk-cat-toggle .chev3.open{transform:rotate(90deg)}
  .mk-cat-toggle .dn{font-size:12.5px;line-height:1;letter-spacing:1.2px;color:#a8c0e4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mk-cat-toggle em{margin-left:auto;font-style:normal;font-size:9.5px;color:#5f7a9c;line-height:1;
    background:rgba(120,170,255,.12);padding:2px 6px;border-radius:9px;flex:none}
  .mk-holder{max-height:calc(100vh - 250px);overflow-y:auto;padding-right:2px}
  .mk-holder::-webkit-scrollbar{width:5px}
  .mk-holder::-webkit-scrollbar-thumb{background:rgba(120,170,255,.24);border-radius:3px}

  /* 评分 */
  .score{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
  .score b{font-size:34px;font-weight:700;
    background:linear-gradient(135deg,#ffd166,#ff8ec7);-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:1;font-variant-numeric:tabular-nums}
  .score span{font-size:11px;color:#7b93b4}
  .stars{color:#ffd166;font-size:15px;letter-spacing:2px}
  .bars{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:10.5px}
  .bar-row i{width:34px;font-style:normal;color:#8ba0c0;flex:none}
  .bar-bg{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
  .bar-bg em{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,#4fd6ff,#7c8cff);transition:width .5s}
  .bar-row u{width:42px;text-decoration:none;color:#c2d4ec;text-align:right;flex:none;
    font-variant-numeric:tabular-nums}

  /* 线路标签 */
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;
    border:1px solid rgba(255,255,255,.16);transition:.16s;color:#dbe6f7}
  .tag:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,.4)}

  /* 站点列表 v=29: 仿高德地图导航设计 —— 卡片式, 大站名, 左侧线路色粗条, 换乘/起讫徽章 */
  .stlist{display:flex;flex-direction:column;gap:3px;max-height:380px;overflow-y:auto;
    padding:6px 4px 6px 4px;margin:4px 0}
  .stlist::-webkit-scrollbar{width:5px}
  .stlist::-webkit-scrollbar-thumb{background:rgba(120,170,255,.22);border-radius:3px}
  /* 单个站点卡片: 左侧 3px 线路色粗条 + 站点大字号 */
  .sti{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;font-size:13.5px;position:relative;
    border-radius:7px;margin:1px 0;transition:background .15s,transform .15s;
    background:rgba(255,255,255,.025);border:1px solid rgba(120,170,255,.10)}
  .sti:hover{background:rgba(120,170,255,.10);transform:translateX(2px);border-color:rgba(120,170,255,.30)}
  /* 左侧 3px 线路色粗条 (高德导航的标志性设计) */
  .sti::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;
    background:var(--c,#4fd6ff);border-radius:2px}
  .sti.cur{background:rgba(79,214,255,.12);border-color:rgba(79,214,255,.45)}
  .sti.cur::before{width:4px;box-shadow:0 0 8px currentColor}
  /* 站点右侧: 换乘/起讫 pill 徽章, 文字明确, 颜色区分 */
  .sti::after{content:"";position:absolute;right:10px;top:50%;transform:translateY(-50%);
    min-width:14px;height:18px;border-radius:9px;padding:0 6px;
    background:transparent;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:600;letter-spacing:.3px;flex:none;color:#0a0e16}
  .sti.xfer::after{content:"换";background:#ff7eb6;color:#fff;
    box-shadow:0 0 6px rgba(255,126,182,.7);animation:xferPulse 2.4s ease-in-out infinite}
  .sti.term::after{content:attr(data-term);background:#ffd166;
    box-shadow:0 0 6px rgba(255,209,102,.7);font-size:10px}
  .sti.term.xfer::after{content:attr(data-term);background:linear-gradient(90deg,#ffd166 0%,#ffd166 45%,#ff7eb6 45%,#ff7eb6 100%);
    box-shadow:0 0 6px rgba(255,180,120,.7);color:#0a0e16;width:auto}
  @keyframes xferPulse{0%,100%{transform:translateY(-50%) scale(1)}
    50%{transform:translateY(-50%) scale(1.08);box-shadow:0 0 10px rgba(255,126,182,.9)}}
  /* 序号: 小字号, 弱化 */
  .sti u{text-decoration:none;min-width:22px;color:#5d7797;font-size:10.5px;flex:none;
    text-align:right;font-variant-numeric:tabular-nums;margin-right:4px}
  /* 站名: 大字号, 当前站高亮 */
  .sti .stn-dot{display:none}
  .sti .stn-name{color:#cfe0f5;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:500;font-size:13.5px;letter-spacing:.2px;
    padding-right:48px}   /* 给右侧 pill 徽章留位置 */
  .sti.cur .stn-name{color:#fff;font-weight:700;font-size:14.5px}
  .sti.term .stn-name{color:#ffd166;font-weight:600}
  .sti.xfer .stn-name{color:#f5c8d8;font-weight:600}

  .note{font-size:10.5px;color:#61789a;line-height:1.65;padding:9px 11px;
    background:rgba(79,214,255,.05);border-left:2px solid rgba(79,214,255,.35);border-radius:0 6px 6px 0}

  /* ================= 灯箱 ================= */
  #lightbox{position:fixed;inset:0;z-index:60;display:none;
    background:rgba(3,6,12,.93);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;user-select:none}
  #lightbox.on{display:flex}
  .lb-stage{position:relative;width:min(92vw,1320px);height:min(78vh,820px);
    display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:pan-y}
  .lb-stage:active{cursor:grabbing}
  .lb-canvas{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;
    background:#0b1220;border:1px solid rgba(120,170,255,.18);
    box-shadow:0 24px 80px rgba(0,0,0,.72)}
  .lb-canvas img{display:block;user-select:none;-webkit-user-drag:none}
  .lb-load{position:absolute;z-index:5;font-size:12px;color:#8fb0d8;letter-spacing:2px;
    padding:8px 18px;border-radius:20px;background:rgba(8,14,26,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(120,170,255,.18)}
  .lb-btn{position:absolute;z-index:2;border:1px solid rgba(255,255,255,.14);cursor:pointer;
    background:rgba(12,20,34,.78);color:#cfe4ff;border-radius:50%;
    display:flex;align-items:center;justify-content:center;transition:.18s;backdrop-filter:blur(8px)}
  .lb-btn:hover{background:rgba(79,214,255,.24);color:#fff;border-color:var(--line2)}
  .lb-prev,.lb-next{width:46px;height:46px;font-size:24px;top:50%;transform:translateY(-50%)}
  .lb-prev{left:2.5vw} .lb-next{right:2.5vw}
  .lb-close{width:36px;height:36px;font-size:20px;top:22px;right:2.5vw}
  .lb-cap{position:absolute;left:0;right:0;bottom:3.5vh;text-align:center;pointer-events:none}
  .lb-cap b{display:block;font-size:16px;color:#fff;font-weight:600;letter-spacing:1px}
  .lb-cap span{font-size:11.5px;color:#8ba0c0}
  .lb-cap em{display:block;margin-top:6px;font-style:normal;font-size:10.5px;color:#5f7a9c;letter-spacing:2px}
  .lb-dots{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(3.5vh + 62px);
    display:flex;gap:7px}
  .lb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.24);cursor:pointer;transition:.18s}
  .lb-dots i.cur{background:var(--cy);box-shadow:0 0 9px var(--cy);width:18px;border-radius:4px}

  /* ================= 真实照片查看器 ================= */
  #photoViewer{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(3,6,12,.94);backdrop-filter:blur(6px)}
  #photoViewer.on{display:flex}
  #pvImg{max-width:90vw;max-height:84vh;border-radius:10px;box-shadow:0 20px 70px rgba(0,0,0,.7);
    border:1px solid rgba(120,170,255,.2)}
  #pvCap{position:absolute;bottom:5vh;left:0;right:0;text-align:center;color:#9fb6d4;font-size:12px;padding:0 20px}
  #pvClose{position:absolute;top:22px;right:2.5vw;width:36px;height:36px;font-size:20px;line-height:1;
    border:1px solid rgba(255,255,255,.14);background:rgba(12,20,34,.78);color:#cfe4ff;border-radius:50%;cursor:pointer}
  #pvClose:hover{background:rgba(79,214,255,.24);color:#fff}

  /* ---------- 底部提示 ---------- */
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:15;
    padding:7px 16px;background:rgba(10,17,30,.72);border:1px solid var(--line);
    border-radius:20px;font-size:11px;color:#7b93b4;backdrop-filter:blur(10px);
    display:flex;gap:14px;white-space:nowrap}
  #hint b{color:#9fd8ff;font-weight:400}

  #srcinfo{position:fixed;right:14px;bottom:14px;z-index:15;font-size:9.5px;
    color:#4e6486;text-align:right;line-height:1.6;pointer-events:none}
  #panel.open ~ #srcinfo{opacity:0}

  .empty{color:#5d7797;font-size:12px;text-align:center;padding:26px 0}

  @media(max-width:960px){
    #side{bottom:auto;max-height:calc(100vh - 120px)}
    #panel{width:100%} #hint{display:none}
    .lb-prev{left:8px} .lb-next{right:8px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="loading">
  <div class="ld-title">上 海</div>
  <div class="ld-sub">SHANGHAI · 3D CITY SANDBOX</div>
  <div class="ld-bar"><i id="ldi"></i></div>
  <div class="ld-txt" id="ldt">正在连接数据源…</div>
</div>

<header>
  <div class="brand">上海 · 三维城市沙盘<small>REAL OSM DATA · 16 DISTRICTS</small></div>
</header>

<!-- ============ 左侧折叠控制台 ============ -->
<aside id="side">
  <div class="side-hd">
    <span>控 制 台</span>
    <button id="sideCollapseAll" title="全部折叠/展开" style="width:20px;height:20px;flex:none;border:1px solid var(--line);cursor:pointer;background:rgba(255,255,255,.05);color:#9ab;border-radius:6px;font-size:10px;line-height:1;margin-right:4px">⇅</button>
    <button id="sideFold" title="收起 / 展开">‹</button>
  </div>
  <div class="side-bd" id="sideBd">
    <section class="acc open" id="accLayers">
      <h4><i class="chev"></i>图层<em id="cLyr"></em></h4>
      <div class="acc-b"><div class="acc-i" id="lyrList"></div></div>
    </section>
    <section class="acc" id="accViews">
      <h4><i class="chev"></i>预设机位<em id="cView"></em></h4>
      <div class="acc-b"><div class="acc-i" id="viewList"></div></div>
    </section>
    <section class="acc" id="accMarks">
      <h4><i class="chev"></i>地标导览<em id="cMark"></em></h4>
      <div class="acc-b"><div class="acc-i" id="markList"></div></div>
    </section>
  </div>
</aside>

<aside id="panel">
  <div class="p-head">
    <div class="p-kind" id="pKind"></div>
    <div class="p-title" id="pTitle"></div>
    <div class="p-sub" id="pSub"></div>
    <button class="p-close" id="pClose">×</button>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

<!-- ============ 图片灯箱 ============ -->
<div id="lightbox">
  <button class="lb-btn lb-close" id="lbClose">×</button>
  <button class="lb-btn lb-prev" id="lbPrev">‹</button>
  <button class="lb-btn lb-next" id="lbNext">›</button>
  <div class="lb-stage">
    <div class="lb-canvas" id="lbCanvas"></div>
    <div class="lb-load" id="lbLoad">载入影像 …</div>
  </div>
  <div class="lb-dots" id="lbDots"></div>
  <div class="lb-cap">
    <b id="lbTitle"></b><span id="lbSub"></span><em id="lbIdx"></em>
  </div>
</div>

<!-- ============ 真实照片查看器 ============ -->
<div id="photoViewer">
  <button class="lb-btn" id="pvClose">×</button>
  <button class="lb-btn" id="pvPrev" style="left:8px;width:36px;height:36px;font-size:20px;display:none">‹</button>
  <button class="lb-btn" id="pvNext" style="right:8px;width:36px;height:36px;font-size:20px;display:none">›</button>
  <img id="pvImg" alt="">
  <div id="pvCap"></div>
</div>

<div id="hint">
  <span><b>左键拖拽</b> 旋转</span>
  <span><b>滚轮</b> 缩放</span>
  <span><b>右键</b> 平移</span>
  <span><b>点击地标 / 站点</b> 看详情与实景图</span>
</div>

<div id="srcinfo">数据源：OpenStreetMap (ODbL) · 阿里云 DataV 行政区划 · Esri World Imagery · 高德影像与注记<br><span id="ts"></span></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./src/main.js?v=59"></script>
</body>
</html>
